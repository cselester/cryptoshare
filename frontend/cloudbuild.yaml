steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "--build-arg"
      - "VITE_API_BASE_URL=${_VITE_API_BASE_URL}"
      - "--build-arg"
      - "VITE_APP_BASE_URL=${_VITE_APP_BASE_URL}"
      - "-t"
      - "gcr.io/$PROJECT_ID/cryptoshare-frontend"
      - "."
substitutions:
  _VITE_API_BASE_URL: "http://localhost:8000/api"
  _VITE_APP_BASE_URL: "http://localhost:5173"
images:
  - "gcr.io/$PROJECT_ID/cryptoshare-frontend"
